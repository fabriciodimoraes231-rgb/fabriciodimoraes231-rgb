name: Gerar gráfico de contribuições animado

on:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#C1121F&color_dots=#ebedf0,#d4d4d6,#a8a9ad,#5c5c5c,#0d0d0d
            dist/github-snake-dark.svg?color_snake=#E5383B&color_dots=#161b22,#3a3a3a,#6e6e70,#a8a9ad,#ffffff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
